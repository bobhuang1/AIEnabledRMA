name: ci

# Every hour of hosted-runner time is billed, and this job builds nine projects and starts a
# PostgreSQL for the live suites. The rules that keep it cheap:
#
#   * pull requests and manual runs only. A merge to main is a commit that a PR already tested,
#     so running the same job again on push duplicates the cost for no new signal.
#   * documentation-only changes do not start a run at all.
#   * a newer push to the same ref cancels the older run, so a fixup commit does not pay for its
#     predecessor as well.
#   * a hard timeout, because a hung test otherwise bills until the runner gives up.
#   * the NuGet cache is keyed on the lock files, which are checked in.
#
# If this check is ever made required for merging, note that a skipped path filter leaves the
# check absent rather than green: the filter is then the wrong tool, and the run should start and
# exit early instead. Do not add a matrix or a second operating system without saying, in the PR,
# what the extra minutes buy.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rmaci
          POSTGRES_USER: rmauser
          POSTGRES_PASSWORD: rmapassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmauser -d rmaci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The live fixtures create and drop a database per test, so they connect as the cluster's
      # admin user to the maintenance database, not to rmaci.
      RMA_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=rmauser;Password=rmapassword"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # --locked-mode turns a dependency change that was not committed into a build failure,
      # which is the point of checking the lock files in.
      - name: Restore
        run: dotnet restore AIEnabledRma.slnx --locked-mode

      - name: Build
        run: dotnet build AIEnabledRma.slnx --no-restore -warnaserror

      - name: Test
        run: |
          set -o pipefail
          dotnet test AIEnabledRma.slnx --no-build --logger "console;verbosity=normal" | tee test.log

      - name: Fail when any test was skipped
        run: |
          set -euo pipefail
          if grep -Eq "Skipped:[[:space:]]+[1-9]" test.log; then
            echo "::error::Tests were skipped. The live suites must run against the service database."
            grep -E "Skipped:[[:space:]]+[1-9]" test.log
            exit 1
          fi
          if ! grep -Eq "Total:[[:space:]]+[1-9]" test.log; then
            echo "::error::No tests ran."
            exit 1
          fi

      - name: Audit dependencies
        run: |
          set -euo pipefail
          dotnet list AIEnabledRma.slnx package --vulnerable --include-transitive | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::A dependency has a known vulnerability."
            exit 1
          fi
