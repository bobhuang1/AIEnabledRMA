name: ci

# Every hour of hosted-runner time is billed, and this job builds nine projects and starts a
# PostgreSQL for the live suites. The rules that keep it cheap:
#
#   * every push to main, every pull request, and manual runs. Exempting main looked cheaper, but a
#     merge is only pre-tested if the PR actually ran: this repository went from one failed run to no
#     runs at all on main, and twenty commits reached origin without CI ever seeing them. The gate
#     that matters is the one on the branch that ships, so main is checked on push too.
#   * documentation-only changes do not start a run at all: root-level markdown (README, plan,
#     licence) and docs/ are ignored. knowledge-base/ is deliberately not ignored — its markdown
#     is data the retrieval tests read, so a change there can change what the suite sees.
#   * a newer pull-request push cancels the older run, so a fixup commit does not pay for its
#     predecessor as well. Main is never cancelled: cancelling the run for one commit is how this
#     repository ended up with a single recorded run on main, a red one, and no green run after it.
#   * a hard timeout, because a hung test otherwise bills until the runner gives up.
#   * the restore drill is the fourth job, and it is the one that costs minutes to prove something no
#     other job can: that a dump of this schema restores into a database the binary can migrate and
#     read. Its own timeout, and no .NET setup, keep that cost to the drill itself.
#   * the NuGet cache is keyed on the lock files, which are checked in.
#
# If this check is ever made required for merging, note that a skipped path filter leaves the
# check absent rather than green: the filter is then the wrong tool, and the run should start and
# exit early instead. Do not add a matrix or a second operating system without saying, in the PR,
# what the extra minutes buy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
  # No path filter here: a manual run is a person asking for the full gate on purpose.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A pull request is superseded by its next push, and the superseded run is a run nobody wants to
  # read. A commit on main is different: its run is the only evidence that commit has, so cancelling
  # it leaves a red or absent run where a second push would have produced a green one. Both main
  # runs report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # PostgreSQL 16 with the pgvector extension, which the knowledge-store suites need (P5).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rmaci
          POSTGRES_USER: rmauser
          POSTGRES_PASSWORD: rmapassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmauser -d rmaci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The live fixtures create and drop a database per test, so they connect as the cluster's
      # admin user to the maintenance database, not to rmaci.
      RMA_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=rmauser;Password=rmapassword"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # --locked-mode turns a dependency change that was not committed into a build failure,
      # which is the point of checking the lock files in.
      - name: Restore
        run: dotnet restore AIEnabledRma.slnx --locked-mode

      # A failing build has to say why without an authenticated log request. The first two runs on
      # main both failed at this step and all the API answered was "Process completed with exit code
      # 1": the compiler's message lives in the step log, which needs a token, so an SDK mismatch and
      # a real compile error looked identical from outside. So the output is captured, the compiler's
      # own lines are replayed as annotations — which the API serves to anyone — and a binlog stays
      # next to them for whoever opens the run with a token.
      - name: Build
        run: |
          set +e
          dotnet build AIEnabledRma.slnx --no-restore -warnaserror -bl:build.binlog 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::dotnet build failed with exit code $status; the diagnostics follow."
            grep -E '(: error |: warning |^Build FAILED)' build.log | sort -u | head -40 |
              while IFS= read -r line; do
                echo "::error::$(printf '%s' "$line" | cut -c1-400)"
              done
          fi
          exit "$status"

      # A property renamed or a column widened without its migration still compiles and still
      # passes every test that does not open a database. The live suites do notice it, but only as
      # EF's PendingModelChangesWarning thrown out of Migrate(), and not at all on a machine with
      # no database to point them at. So this runs the comparison the EF tooling already
      # implements, before the suite and by its own name, and it needs none of the database
      # service: only the assembly the build step produced.
      - name: Model and migrations agree
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/AIEnabledRma.Data \
            --no-build \
            --configuration Debug

      - name: Test
        run: |
          set -o pipefail
          dotnet test AIEnabledRma.slnx --no-build --logger "console;verbosity=normal" | tee test.log

      - name: Fail when any test was skipped
        run: |
          set -euo pipefail
          if grep -Eq "Skipped:[[:space:]]+[1-9]" test.log; then
            echo "::error::Tests were skipped. The live suites must run against the service database."
            grep -E "Skipped:[[:space:]]+[1-9]" test.log
            exit 1
          fi
          if ! grep -Eq "Total tests:[[:space:]]+[1-9]" test.log; then
            echo "::error::No tests ran."
            exit 1
          fi

      - name: Audit dependencies
        run: |
          set -euo pipefail
          dotnet list AIEnabledRma.slnx package --vulnerable --include-transitive | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::A dependency has a known vulnerability."
            exit 1
          fi

  auth-flows:
    # The realm import and both token flows were verified by hand, in a terminal, and the realm has
    # already failed to import once on a field Keycloak rejects. This boots the committed realm and
    # the mcp-http profile and drives the client-credentials and PKCE flows with the same script
    # docs/mcp.md points at, so an edit that breaks the import or a check fails here instead of in a
    # runbook nobody re-ran. It builds the tool server's image, which is why it is a separate job.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the realm import and both auth flows
        run: ./scripts/verify-auth.sh

  runtime-images:
    # The publish-side tests prove that `dotnet publish` carries the corpus; this proves that the
    # images do. The Docker build sees only what .dockerignore admits and restores from a hand-written
    # COPY list, so it can differ from publish in both directions, and it has: the tool server's
    # publish carried no corpus items at all, and the Web image could not be built because a
    # referenced manifest was missing from its COPY list. Neither is visible from a checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check what each runtime image carries, boot both corpus hosts, and start the production web service
        # The tool server's image is built by auth-flows as well, on another machine, so the layers
        # cannot be handed over — but the buildx cache keyed on the image name means a rerun of either
        # job reuses what the other already compiled, and a Dockerfile change invalidates only its
        # own scope. Unset locally, where there is no Actions cache to talk to.
        env:
          RMA_IMAGE_CACHE: "1"
        run: ./scripts/verify-images.sh

      # The step above starts the pack's web service from the example env; this is the cheaper half,
      # and it is kept separate so a file that does not parse fails by itself rather than inside a
      # build-and-boot log. The production pack is a compose file, so a typo in it stays invisible
      # until a deployment; this resolves it — interpolating every required value from the example
      # env file — and then checks what a resolve alone cannot see: that every
      # `condition: service_healthy` names a service with a probe, because compose accepts that
      # reference either way and the wait would be found at deployment instead. Nothing is started.
      - name: The production pack resolves and every wait in it can finish
        run: ./scripts/verify-compose.sh

  restore-drill:
    # Migrations are forward-only and `reset --force` is the only other documented recovery, and that
    # is not a recovery: it drops the database. Nothing here proved a dump of this schema could be
    # restored into a database the deployed binary can then migrate and read, which is the one thing
    # a backup has to do. This runs scripts/restore-drill.sh — the same drill the local gate runs —
    # so a migration that makes the dump unrestorable fails on its own commit rather than on the day
    # the backup is the only copy. It is a job of its own rather than a step of build-and-test: it
    # publishes DbAdmin and moves a dump through two containers, and it needs neither the .NET SDK
    # nor the service database the other job sets up.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dump a seeded database, restore it into a scratch one, migrate it and query it
        run: ./scripts/restore-drill.sh
