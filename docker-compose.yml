name: aienabledrma

services:
  postgres:
    image: postgres:16-alpine
    container_name: aienabledrma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmadev}
      POSTGRES_USER: ${POSTGRES_USER:-rmauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmapassword}
      # Deterministic collation so trigram similarity is stable across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmauser} -d ${POSTGRES_DB:-rmadev}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
