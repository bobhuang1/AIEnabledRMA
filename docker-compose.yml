name: aienabledrma

services:
  postgres:
    # PostgreSQL 16 with the pgvector extension, for the knowledge store (DbAdmin kb-ingest).
    # Same major version as the earlier postgres:16-alpine image and the cluster uses locale C, so
    # an existing ./data/pgdata directory is reused as is. `docker compose up` recreates the
    # container with this image; the data directory is kept.
    image: pgvector/pgvector:pg16
    container_name: aienabledrma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmadev}
      POSTGRES_USER: ${POSTGRES_USER:-rmauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmapassword}
      # Deterministic collation so trigram similarity is stable across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Loopback only: the default credentials are for local development and must not be
      # reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmauser} -d ${POSTGRES_DB:-rmadev}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
