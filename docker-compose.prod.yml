# Production pack (P11). Everything that is a secret or deployment-specific comes from the
# environment (an .env file kept out of git, or the orchestrator's secret store); every one marked
# :? must be set or compose refuses to start. Nothing but the TLS proxy is published.
#
#   docker compose -f docker-compose.prod.yml --env-file prod.env up -d --build
#
name: aienabledrma-prod

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Rma: Host=postgres;Port=5432;Database=${POSTGRES_DB:-rmaprod};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

# Readiness for the three application services: an HTTP 200 from /health, not "the container is
# running". A process that is alive but still loading, or one stuck on a dependency, is exactly the
# state a proxy should not route to, and `depends_on`'s default condition cannot tell it apart.
#
# Deliberately not curl: none of these images carries curl, and installing it to run a probe would
# add a package to three production images to answer one question. bash and grep are in the Debian
# base, and bash's /dev/tcp is enough to send the request and read the status line back.
x-http-readiness: &http-readiness
  test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "^HTTP/1.1 200" <&3']
  interval: 10s
  timeout: 5s
  retries: 6
  # Generous, because a host that is still loading its corpus is not broken and a restart loop in
  # the first seconds would report it as one.
  start_period: 20s

services:
  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "443:443"
      - "80:80"
    environment:
      RMA_WEB_HOST: ${RMA_WEB_HOST:?set RMA_WEB_HOST}
      RMA_MCP_HOST: ${RMA_MCP_HOST:?set RMA_MCP_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      mcp:
        condition: service_healthy
    # The edge needs a probe of its own: it was the one service `docker compose ps` showed as running
    # with nothing asking whether it could serve. It does not probe :80 or :443. Port 80 answers a
    # redirect, and a client that follows it needs a certificate ACME may not have issued yet; port
    # 443 cannot answer at all before then. Either probe calls a working edge dead exactly when a
    # deployment is least able to look. The admin endpoint on localhost answers with the config Caddy
    # has loaded, so it is up only when the process is up, and it is not published outside the
    # container.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmaprod}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # Not published: only the app containers on the internal network reach it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: src/AIEnabledRma.Web/Dockerfile
    environment:
      <<: *app-env
      # Operator key for /health detail and the RAG admin endpoints (the owner's Rag:Admin:ApiKey).
      Rag__Admin__ApiKey: ${RMA_OPERATIONS_KEY:?set RMA_OPERATIONS_KEY}
      OperatorAuth__Authority: ${OIDC_AUTHORITY:?set OIDC_AUTHORITY}
      OperatorAuth__ClientId: ${OIDC_OPERATOR_CLIENT_ID:?set OIDC_OPERATOR_CLIENT_ID}
      OperatorAuth__ClientSecret: ${OIDC_OPERATOR_CLIENT_SECRET:?set OIDC_OPERATOR_CLIENT_SECRET}
      Payments__Provider: stripe
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET}
      # Required, with no default: the bundled 'example-local' model answers from canned text and
      # every host refuses it in Production, so a deployment that forgot to choose a provider would
      # crash-loop rather than start on the demo model.
      Ai__Provider: ${AI_PROVIDER:?set AI_PROVIDER}
      Ai__OpenAiCompatible__BaseUrl: ${AI_BASE_URL:-}
      Ai__OpenAiCompatible__ApiKey: ${AI_API_KEY:-}
      Rag__VectorStore__Enabled: ${RAG_VECTOR_STORE:-false}
      # D4: a local Ollama model by default; switch to a hosted one with EMBEDDINGS_PROVIDER=openai-compatible.
      Embeddings__Provider: ${EMBEDDINGS_PROVIDER:-ollama}
      Embeddings__BaseUrl: ${EMBEDDINGS_BASE_URL:-http://ollama:11434}
      Embeddings__Model: ${EMBEDDINGS_MODEL:-nomic-embed-text}
      Embeddings__Dimensions: ${EMBEDDINGS_DIMENSIONS:-768}
      Embeddings__ApiKey: ${EMBEDDINGS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *http-readiness

  mcp:
    <<: *hardening
    build:
      context: .
      dockerfile: src/AIEnabledRma.Mcp/Dockerfile
    environment:
      <<: *app-env
      Mcp__Transport: http
      # The tool server's own log level is Warning, so a successful start says nothing at all;
      # an operator (and scripts/verify-images.sh) needs one line that says it got past startup.
      Logging__LogLevel__Microsoft.Hosting.Lifetime: Information
      # The owner's Mcp:Http settings (see docs/mcp.md): issuer, audience, scope, client allow-list.
      Mcp__Http__Issuer: ${OIDC_AUTHORITY:?set OIDC_AUTHORITY}
      Mcp__Http__Audience: aienabledrma-mcp
      Mcp__Http__RequiredScope: rma:read
      Mcp__Http__AllowedClientIds__0: ${MCP_CLIENT_ID:?set MCP_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *http-readiness

  # Local embedding model (D4). Internal only; pull the model once:
  #   docker compose -f docker-compose.prod.yml exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:0.12.3@sha256:c622a7adec67cf5bd7fe1802b7e26aa583a955a54e91d132889301f50c3e0bd0
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  rag:
    <<: *hardening
    build:
      context: .
      dockerfile: src/AIEnabledRma.Rag/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Rag__Admin__ApiKey: ${RAG_ADMIN_KEY:?set RAG_ADMIN_KEY}
    healthcheck: *http-readiness

volumes:
  ollama:
  pgdata:
  caddy-data:
  caddy-config:
